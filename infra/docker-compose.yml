# Lumen local infra: Postgres (TPC-H) + Cube.dev (semantic layer).
#   docker compose -f infra/docker-compose.yml up -d
# Postgres is exposed on host :5544 (for `lumen seed` + the runtime's metering).
# Cube talks to Postgres over the compose network (host `postgres`).

name: lumen

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: lumen
      POSTGRES_DB: lumen
    ports:
      - "5544:5432"
    volumes:
      # PG18 images store data under a versioned subdir; mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumen -d lumen"]
      interval: 3s
      timeout: 3s
      retries: 20

  cube:
    image: cubejs/cube:v1.6.64
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"   # REST API + Developer Playground
    environment:
      CUBEJS_DEV_MODE: "true"
      CUBEJS_API_SECRET: "lumen-dev-cube-secret"
      CUBEJS_DB_TYPE: "postgres"
      CUBEJS_DB_HOST: "postgres"
      CUBEJS_DB_PORT: "5432"
      CUBEJS_DB_NAME: "lumen"
      CUBEJS_DB_USER: "lumen"
      CUBEJS_DB_PASS: "lumen"
      CUBEJS_PG_SQL_PORT: "15432"
    volumes:
      - ./cube:/cube/conf

volumes:
  pgdata:
